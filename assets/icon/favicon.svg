<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Icon Background (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" />
  
  <!-- Scale Body -->
  <rect x="116" y="116" width="280" height="280" rx="56" ry="56" fill="url(#scaleGrad)" filter="url(#shadow)" />
  
  <!-- Bioimpedance Sensor Plates -->
  <rect x="146" y="226" width="64" height="136" rx="32" fill="#ffffff" opacity="0.25" />
  <rect x="302" y="226" width="64" height="136" rx="32" fill="#ffffff" opacity="0.25" />
  
  <!-- Display Screen -->
  <rect x="186" y="146" width="140" height="64" rx="20" fill="#ffffff" opacity="0.95" />
  
  <!-- Weight Text -->
  <text x="256" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#4338CA" text-anchor="middle" letter-spacing="-1">72.5</text>
</svg>