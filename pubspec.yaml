name: biostats
description: "Aplicativo pessoal de autoavaliação física, composição corporal e acompanhamento de progresso."
publish_to: 'none'
version: 1.6.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  file_selector: ^1.0.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6
  local_auth: ^2.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
